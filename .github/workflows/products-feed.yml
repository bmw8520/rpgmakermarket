name: Build itch.io product feed

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate docs/products.xml from itch.io
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: python scripts/build_products_feed.py docs/products.xml

      - name: Commit feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/products.xml
          if git diff --cached --quiet; then
            echo "Feed unchanged."
          else
            git commit -m "Update itch.io product feed"
            git push
          fi
